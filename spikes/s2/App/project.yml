name: OrchS2
options:
  bundleIdPrefix: io.severin.orch
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  PushCore:
    path: ../PushCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    ENABLE_DEBUG_DYLIB: NO
    CODE_SIGN_IDENTITY: "-"           # ad-hoc: enough for the Simulator, entitlements are embedded
targets:
  OrchApp:
    type: application
    platform: iOS
    sources:
      - OrchApp
      - Shared
      - OrchNSE/NotificationService.swift   # spike only: lets the app drive the NSE code in-process (selftest)
      - path: demo_material.json      # generated by make_push.py, copied here by e2e/ios/s2-run.sh
        buildPhase: resources
    dependencies:
      - package: PushCore
      - target: OrchNSE
        embed: true
    entitlements:
      path: OrchApp/OrchApp.entitlements
      properties:
        com.apple.security.application-groups: [group.io.severin.orch]
    info:
      path: OrchApp/Info.plist
      properties:
        CFBundleDisplayName: orch S2
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.severin.orch
  OrchNSE:
    type: app-extension
    platform: iOS
    sources:
      - OrchNSE
      - Shared
      - path: demo_material.json
        buildPhase: resources
    dependencies:
      - package: PushCore
    entitlements:
      path: OrchNSE/OrchNSE.entitlements
      properties:
        com.apple.security.application-groups: [group.io.severin.orch]
    info:
      path: OrchNSE/Info.plist
      properties:
        CFBundleDisplayName: orch S2 NSE
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.severin.orch.notify
