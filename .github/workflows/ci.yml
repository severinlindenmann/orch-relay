name: ci
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: uv sync --locked --python 3.14
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: uv build --wheel
