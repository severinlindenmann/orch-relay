[project]
name = "orch-relay"
version = "0.1.0"
description = "orch-relay: directory, relay, drop and push for orch v2"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
orch-relay = "orch_relay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_relay"]

[dependency-groups]
dev = ["pytest>=8", "cryptography>=43", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["slow: tests taking more than 2 s"]

[tool.ruff]
line-length = 100
# ref/ and tests/test_vectors.py are the reviewed wire-contract files (PR #23), deliberately
# unchanged in this PR; they have pre-existing lint findings to be fixed in a follow-up.
extend-exclude = ["ref", "tests/test_vectors.py"]
